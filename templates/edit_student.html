{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block page_title %}Edit Student{% endblock %}
{% block breadcrumb %}Home / Students / Edit{% endblock %}

{% block content %}
<div class="fade-in" style="max-width:700px;margin:0 auto;">

  <div class="page-header">
    <div class="page-header-left">
      <h1 class="page-heading">Edit Student</h1>
      <p class="page-sub">{{ student.roll_no }} — {{ student.name }}</p>
    </div>
    <a href="{{ url_for('students.student_detail', student_id=student.id) }}" class="btn-ef btn-ef-ghost">← Back</a>
  </div>

  <div class="ef-card">
    <div class="ef-card-body">
      <form method="POST" action="{{ url_for('students.edit_student', student_id=student.id) }}">

        <div class="grid-2">
          <div class="ef-form-group">
            <label class="ef-label" for="name">Full Name *</label>
            <input type="text" class="ef-input" id="name" name="name" value="{{ student.name }}" required />
          </div>
          <div class="ef-form-group">
            <label class="ef-label">Roll Number</label>
            <input type="text" class="ef-input" value="{{ student.roll_no }}" disabled style="opacity:0.5;cursor:not-allowed;" />
          </div>
        </div>

        <div class="grid-2">
          <div class="ef-form-group">
            <label class="ef-label" for="email">Email</label>
            <input type="email" class="ef-input" id="email" name="email" value="{{ student.email or '' }}" />
          </div>
          <div class="ef-form-group">
            <label class="ef-label" for="phone">Phone</label>
            <input type="text" class="ef-input" id="phone" name="phone" value="{{ student.phone or '' }}" />
          </div>
        </div>

        <div class="grid-2">
          <div class="ef-form-group">
            <label class="ef-label" for="course">Course *</label>
            <select class="ef-select" id="course" name="course" required>
              {% for c in ['B.Tech CSE','B.Tech IT','B.Tech ECE','BCA','MCA','B.Sc CS'] %}
              <option value="{{ c }}" {% if student.course == c %}selected{% endif %}>{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="ef-form-group">
            <label class="ef-label" for="gender">Gender</label>
            <select class="ef-select" id="gender" name="gender">
              <option value="">-</option>
              {% for g in ['Male','Female','Other'] %}
              <option value="{{ g }}" {% if student.gender == g %}selected{% endif %}>{{ g }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="ef-form-group">
            <label class="ef-label" for="semester">Semester *</label>
            <select class="ef-select" id="semester" name="semester" required>
              {% for i in range(1, 9) %}
              <option value="{{ i }}" {% if student.semester == i %}selected{% endif %}>Semester {{ i }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="ef-form-group">
            <label class="ef-label" for="section">Section *</label>
            <select class="ef-select" id="section" name="section" required>
              {% for sec in ['A','B','C','D'] %}
              <option value="{{ sec }}" {% if student.section == sec %}selected{% endif %}>Section {{ sec }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="ef-form-group">
          <label class="ef-label">
            <input type="checkbox" name="is_active" {% if student.is_active %}checked{% endif %}
                   style="margin-right:8px;accent-color:var(--peach);" />
            Active Student
          </label>
        </div>

        <div class="divider"></div>
        <div style="display:flex;gap:12px;justify-content:flex-end;">
          <a href="{{ url_for('students.student_detail', student_id=student.id) }}" class="btn-ef btn-ef-ghost">Cancel</a>
          <button type="submit" class="btn-ef btn-ef-primary">💾 Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
